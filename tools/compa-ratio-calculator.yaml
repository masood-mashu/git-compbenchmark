name: compa-ratio-calculator
version: 1.0.0
description: "Calculates compa-ratio of proposed candidate salary against job band midpoint"
input_schema:
  type: object
  properties:
    comp_data_json:
      type: string
      description: "JSON string containing proposed_salary and band_midpoint in USD"
  required:
    - comp_data_json
implementation:
  type: script
  path: compa_ratio_calculator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
